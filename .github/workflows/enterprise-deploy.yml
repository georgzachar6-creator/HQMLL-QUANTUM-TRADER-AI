name: Enterprise Web — Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'web/frontend/**'
      - 'docker/**'
  workflow_dispatch: {}

concurrency:
  group: enterprise-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────
  # Build Enterprise Web
  # ─────────────────────────────────────────
  build:
    name: 🏗️ Build React App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install & Build
        working-directory: web/frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-dist
          path: web/frontend/dist/
          retention-days: 7

  # ─────────────────────────────────────────
  # Deploy to Vercel (Enterprise Web)
  # ─────────────────────────────────────────
  deploy-vercel:
    name: ▲ Deploy to Vercel
    runs-on: ubuntu-latest
    needs: build
    if: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: enterprise-dist
          path: web/frontend/dist/

      - name: Deploy to Vercel (production)
        uses: amondnet/vercel-action@v20
        with:
          vercel-token:      ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id:     ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: web/frontend
          vercel-args: '--prod'

  # ─────────────────────────────────────────
  # Deploy to Netlify
  # ─────────────────────────────────────────
  deploy-netlify:
    name: 🌐 Deploy to Netlify
    runs-on: ubuntu-latest
    needs: build
    if: ${{ secrets.NETLIFY_AUTH_TOKEN != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: enterprise-dist
          path: dist/

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v1.3
        with:
          publish-dir: dist/
          production-deploy: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID:    ${{ secrets.NETLIFY_SITE_ID }}

  # ─────────────────────────────────────────
  # Deploy to Firebase Hosting
  # ─────────────────────────────────────────
  deploy-firebase:
    name: 🔥 Deploy to Firebase
    runs-on: ubuntu-latest
    needs: build
    if: ${{ secrets.FIREBASE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: enterprise-dist
          path: web/frontend/dist/

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Deploy to Firebase Hosting
        uses: w9jds/firebase-action@v1.5.0
        with:
          args: deploy --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
