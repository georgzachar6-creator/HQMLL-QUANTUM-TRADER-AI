name: HQMLL Quantum Trader — CI/CD Pipeline

on:
  push:
    branches: [ main, develop, release/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'all'
        type: choice
        options: [ all, web, apk, analyze ]

# ─────────────────────────────────────────────────────────────
# CONCURRENCY — Cancel duplicate runs on same branch
# ─────────────────────────────────────────────────────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.35.4'
  JAVA_VERSION:    '17'

jobs:
  # ═══════════════════════════════════════════════════════════
  # JOB 1: Code Analysis
  # ═══════════════════════════════════════════════════════════
  analyze:
    name: 🔍 Flutter Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze --no-fatal-infos

      - name: Check formatting
        run: dart format --output none --set-exit-if-changed lib/

  # ═══════════════════════════════════════════════════════════
  # JOB 2: Build Flutter Web
  # ═══════════════════════════════════════════════════════════
  build-web:
    name: 🌐 Build Flutter Web
    runs-on: ubuntu-latest
    needs: analyze
    if: github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'web' || github.event.inputs.build_type == ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Web (release)
        run: |
          flutter build web --release \
            --dart-define=flutter.inspector.structuredErrors=false \
            --dart-define=debugShowCheckedModeBanner=false

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hqmll-web-${{ github.sha }}
          path: build/web/
          retention-days: 30

      - name: Upload to GitHub Pages (main branch only)
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          commit_message: 'deploy: HQMLL Web v${{ github.run_number }}'

  # ═══════════════════════════════════════════════════════════
  # JOB 3: Build Android APK
  # ═══════════════════════════════════════════════════════════
  build-apk:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    needs: analyze
    if: github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Create keystore from secret (if available)
        if: secrets.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release-key.jks
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release-key.jks
          EOF

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Get APK info
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          APK_SIZE=$(du -sh "$APK_PATH" | cut -f1)
          echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV
          echo "APK built successfully: $APK_SIZE"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hqmll-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create Release (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          body: |
            ## HQMLL Quantum Trader ${{ github.ref_name }}

            ### 📱 Android APK
            - Size: ${{ env.APK_SIZE }}
            - Package: com.quantumtrader.trade
            - Min SDK: Android 5.0 (API 21)

            ### 🌐 Web Preview
            Available on GitHub Pages after deployment.

            ### 📋 Changes
            See [CHANGELOG](CHANGELOG.md) for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════════
  # JOB 4: Build AAB (App Bundle) — for Play Store
  # ═══════════════════════════════════════════════════════════
  build-aab:
    name: 📦 Build App Bundle (AAB)
    runs-on: ubuntu-latest
    needs: [ analyze ]
    if: github.ref == 'refs/heads/main' && (github.event.inputs.build_type == 'all' || github.event.inputs.build_type == '')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hqmll-aab-${{ github.sha }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  # ═══════════════════════════════════════════════════════════
  # JOB 4b: Build Enterprise Web (React + Vite)
  # ═══════════════════════════════════════════════════════════
  build-enterprise-web:
    name: 🏢 Build Enterprise Web (React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install dependencies
        working-directory: web/frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build Enterprise Web
        working-directory: web/frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload Enterprise Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hqmll-enterprise-web-${{ github.sha }}
          path: web/frontend/dist/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════
  # JOB 4c: Docker Build (Enterprise Web)
  # ═══════════════════════════════════════════════════════════
  build-docker:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    needs: build-enterprise-web
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -f docker/Dockerfile -t hqmll-enterprise-web:latest .
          echo "Docker build successful"

  # ═══════════════════════════════════════════════════════════
  # JOB 5: Deploy to Vercel (Web)
  # ═══════════════════════════════════════════════════════════
  deploy-vercel:
    name: ☁️ Deploy to Vercel
    runs-on: ubuntu-latest
    needs: build-web
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ steps.vercel-deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Web for Vercel
        run: |
          flutter build web --release \
            --base-href "/" \
            --dart-define=flutter.inspector.structuredErrors=false

      - name: Deploy to Vercel
        id: vercel-deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: build/web
          vercel-args: '--prod'

  # ═══════════════════════════════════════════════════════════
  # JOB 6: Notify Summary
  # ═══════════════════════════════════════════════════════════
  summary:
    name: 📊 Build Summary
    runs-on: ubuntu-latest
    needs: [ analyze, build-web, build-apk, build-enterprise-web ]
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "# 🚀 HQMLL Quantum Trader v46 — Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Flutter Analyze | ${{ needs.analyze.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Flutter Web Build | ${{ needs.build-web.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📱 Android APK | ${{ needs.build-apk.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏢 Enterprise Web (React) | ${{ needs.build-enterprise-web.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v46.0.0 — Enterprise Integration" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Features v46" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ TimeCrystal Deep Reasoning Engine (v44)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ QML Research Screen 5-Tab (v44)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ PhaseDiagram CustomPainter (v45)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Dashboard Quantum Research Panel (v45)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Enterprise Web Frontend React+Vite (v46)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ PWA + Service Worker (v46)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Docker Multi-stage Build (v46)" >> $GITHUB_STEP_SUMMARY
